name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  QT_VERSION: '6.12.0'
  ANDROID_NDK_VERSION: '27.2.12479018'
  ANDROID_BUILD_TOOLS: '36.0.0'
  ANDROID_PLATFORM: 'android-36'

jobs:
  unit-tests:
    name: Unit tests (desktop + MariaDB)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: testpass
          MARIADB_DATABASE: test
        ports: [ '3306:3306' ]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt (desktop)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libmariadb-dev libssl-dev libgl1-mesa-dev libxkbcommon-dev
      - name: Rust ssh_bridge tests + host staticlib
        working-directory: rust/ssh_bridge
        run: cargo test && cargo build --release
      - name: PHP agent (7.4 = minimum supported) on 127.0.0.1:8099
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mysqli, mbstring, json
          tools: none
      - name: Start PHP agent
        env:
          NAWI_TOKEN: ci-token
          NAWI_ALLOW_REMOTE_HOST: ''
        run: |
          php -l agent/tunnel.php
          nohup php -S 127.0.0.1:8099 -t agent > "$RUNNER_TEMP/php-agent.log" 2>&1 &
          for i in $(seq 20); do curl -s -o /dev/null http://127.0.0.1:8099/tunnel.php && break; sleep 0.5; done
          curl -s -H 'X-Nawi-Token: ci-token' -d '{"action":"ping","db":{"host":"127.0.0.1","port":3306,"user":"root","pass":"testpass","name":"test"}}' http://127.0.0.1:8099/tunnel.php; echo
      - name: PHP agent log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/php-agent.log" || true
      - name: Start SSH server for tunnel tests
        run: |
          sudo apt-get install -y --no-install-recommends openssh-server
          sudo mkdir -p /run/sshd
          # UsePAM no: sshd tolak akun terkunci ("!" di shadow). Ganti ke "*" (password tak valid, tapi tidak terkunci).
          sudo usermod -p '*' "$USER"
          D="$HOME/nawi-ssh" && mkdir -p "$D" "$HOME/.ssh" && chmod 700 "$D" "$HOME/.ssh"
          ssh-keygen -q -t ed25519 -f "$D/host_key" -N ""
          ssh-keygen -q -t ed25519 -f "$D/client_key" -N ""
          cp "$D/client_key.pub" "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys" "$D/client_key"
          cat > "$D/sshd_config" <<EOF
          Port 2222
          ListenAddress 127.0.0.1
          HostKey $D/host_key
          AuthorizedKeysFile .ssh/authorized_keys
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          UsePAM no
          StrictModes no
          LogLevel VERBOSE
          PidFile $D/sshd.pid
          AllowUsers $USER
          EOF
          sudo /usr/sbin/sshd -f "$D/sshd_config" -E "$D/sshd.log"
      - name: Verify SSH test server
        run: |
          ls -la "$HOME/.ssh" "$HOME/nawi-ssh"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$HOME/nawi-ssh/client_key" -p 2222 "$USER"@127.0.0.1 true
      - name: SSH server log on failure
        if: failure()
        run: sudo cat "$HOME/nawi-ssh/sshd.log" || true
      - name: Build + run QtTest
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_USER: root
          TEST_DB_PASS: testpass
          TEST_DB_NAME: test
          TEST_HTTP_URL: http://127.0.0.1:8099/tunnel.php
          TEST_HTTP_TOKEN: ci-token
          TEST_SSH_HOST: 127.0.0.1
          TEST_SSH_PORT: 2222
          TEST_SSH_USER: runner
          TEST_SSH_KEY: /home/runner/nawi-ssh/client_key
        run: |
          cmake -S . -B build-test -GNinja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-test
          QT_QPA_PLATFORM=offscreen ctest --test-dir build-test --output-on-failure

  build-android:
    name: Build APK (arm64-v8a)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;${{ env.ANDROID_PLATFORM }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
            ndk;${{ env.ANDROID_NDK_VERSION }}

      # Installs Qt android_arm64_v8a + matching desktop host Qt (autodesktop), sets QT_HOST_PATH.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: android
          arch: android_arm64_v8a
          modules: ''
          cache: true

      - name: Cache native deps (OpenSSL + MariaDB Connector/C)
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: deps/out
          key: deps-arm64-${{ hashFiles('scripts/build-deps.sh') }}-ndk${{ env.ANDROID_NDK_VERSION }}

      - name: Build native deps
        if: steps.cache-deps.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
        run: ./scripts/build-deps.sh

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            rust/ssh_bridge/target
          key: cargo-${{ hashFiles('rust/ssh_bridge/Cargo.lock', 'rust/ssh_bridge/Cargo.toml') }}

      - name: Build ssh_bridge (Rust)
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
        run: ./scripts/build-rust.sh

      # Qt Network (HTTPS to the PHP agent) loads libssl_3.so/libcrypto_3.so at runtime on Android.
      - name: OpenSSL 3 shared libs for Qt Network
        run: |
          mkdir -p deps/ssl
          for l in libssl_3 libcrypto_3; do
            curl -fsSL -o deps/ssl/$l.so https://github.com/KDAB/android_openssl/raw/master/ssl_3/arm64-v8a/$l.so
          done
          ls -l deps/ssl

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "QT_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_STORE_PASS=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_KEY_PASS=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_ANDROID_SIGN_APK=ON \
            -DNAWI_SSL_LIBS_DIR="$PWD/deps/ssl" \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"

      - name: Build APK
        run: cmake --build build --target apk --parallel

      - name: Locate APK
        run: |
          find build -name '*.apk' -print
          mkdir -p out && cp "$(find build -name '*signed*.apk' -o -name '*release*.apk' | head -n1)" out/NawiDBMan-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NawiDBMan-arm64
          path: out/NawiDBMan-arm64.apk
          retention-days: 7
