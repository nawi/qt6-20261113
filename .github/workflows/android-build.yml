name: Build Qt 6.8 Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Memungkinkan trigger build manual dari tab Actions

env:
  QT_VERSION: '6.8.3'
  ANDROID_NDK_VERSION: '26.1.10909125'
  ANDROID_BUILD_TOOLS: '34.0.0'
  ANDROID_PLATFORM: 'android-34'

jobs:
  build-android:
    name: Build APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: >
            platform-tools
            platforms;${{ env.ANDROID_PLATFORM }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
            ndk;${{ env.ANDROID_NDK_VERSION }}

      - name: Cache Qt Installation
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/Qt
          key: qt-${{ env.QT_VERSION }}-android-arm64

      - name: Install Qt 6.8 for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          dir: ${{ github.workspace }}/Qt
          cached: ${{ steps.cache-qt.outputs.cache-hit }}

      - name: Configure CMake
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
        run: |
          qt-cmake -B build \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_ANDROID_BUILD_ALL_ABIS=OFF \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=${{ env.ANDROID_PLATFORM }}

      - name: Build APK
        run: cmake --build build --target apk --parallel

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NawiDBMan-debug-arm64
          path: build/android-build/build/outputs/apk/debug/*.apk
          retention-days: 1 # Hemat kuota storage 500 MB Free Tier